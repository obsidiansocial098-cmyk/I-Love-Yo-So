<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Us</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  background: linear-gradient(180deg, #000, #1a1a1a);
  color: white;
  overflow-x: hidden;
}

section {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
}

/* Images */
.images {
  display: flex;
  gap: 15px;
}

img {
  width: 140px;
  border-radius: 20px;
  filter: blur(10px);
  transition: 1.5s ease;
}

.clear {
  filter: blur(0);
  transform: scale(1.05);
}

/* Text */
.fade {
  opacity: 0;
  transform: translateY(20px);
  transition: 1s;
}

.show {
  opacity: 1;
  transform: translateY(0);
}

/* Button */
button {
  padding: 10px 20px;
  border: none;
  background: white;
  color: black;
  border-radius: 20px;
  cursor: pointer;
  margin-top: 20px;
}

/* Hearts */
.hearts {
  position: fixed;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.heart {
  position: absolute;
  bottom: -20px;
  animation: floatUp linear forwards;
}

@keyframes floatUp {
  to {
    transform: translateY(-110vh);
    opacity: 0;
  }
}

/* Burst */
.burst {
  position: fixed;
  pointer-events: none;
  transform: translate(-50%, -50%);
  animation: explode 0.8s ease-out forwards;
}

@keyframes explode {
  to {
    transform: translate(var(--x), var(--y)) scale(1.5);
    opacity: 0;
  }
}

/* Name glow */
.name {
  font-size: 32px;
  margin-top: 10px;
  color: #ff7aa2;
  opacity: 0;
  transform: scale(0.8);
  transition: 1s;
}

.name.show {
  opacity: 1;
  transform: scale(1.1);
  animation: glow 2s infinite alternate;
}

@keyframes glow {
  from {
    text-shadow: 0 0 5px #ff7aa2, 0 0 10px #ff4d6d;
  }
  to {
    text-shadow: 0 0 15px #ff99ac, 0 0 30px #ff1f5a;
  }
}
</style>
</head>

<body>

<div class="hearts"></div>

<audio id="bgMusic" src="music.mp3" loop></audio>

<!-- Section 1 -->
<section>
  <div class="images">
    <img src="photo1.jpg" id="img1">
    <img src="photo2.jpg" id="img2">
  </div>
  <h1 class="fade" id="t1">We didn’t know it then…</h1>
  <button onclick="start()">See more</button>
</section>

<!-- Section 2 -->
<section>
  <h1 class="fade" id="t2"></h1>
</section>

<!-- Section 3 -->
<section>
  <h1 class="fade" id="t3"></h1>
  <h2 id="nameText" class="name"></h2>
</section>

<!-- Section 4 -->
<section>
  <h1 class="fade" id="t4">Still is.</h1>
  <button onclick="finalMsg()">Stay</button>
  <p id="finalText" class="fade"></p>
</section>

<script>
// show first text
window.onload = () => {
  document.getElementById("t1").classList.add("show");
};

// typing
function typeText(el, text, speed = 40) {
  let i = 0;
  el.innerHTML = "";
  function type() {
    if (i < text.length) {
      el.innerHTML += text.charAt(i);
      i++;
      setTimeout(type, speed);
    }
  }
  type();
}

// floating hearts
function createHeart() {
  const h = document.createElement("div");
  h.className = "heart";
  h.innerHTML = "❤";
  h.style.left = Math.random() * 100 + "vw";
  h.style.fontSize = (15 + Math.random() * 20) + "px";
  h.style.color = ["#ff4d6d","#ff99ac","#fff"][Math.floor(Math.random()*3)];
  h.style.animationDuration = (4 + Math.random()*3) + "s";
  document.querySelector(".hearts").appendChild(h);
  setTimeout(()=>h.remove(),7000);
}

// burst hearts
function burst(x,y){
  for(let i=0;i<10;i++){
    let b=document.createElement("div");
    b.className="burst";
    b.innerHTML="❤";
    b.style.left=x+"px";
    b.style.top=y+"px";
    let a=Math.random()*2*Math.PI;
    let d=60+Math.random()*60;
    b.style.setProperty("--x",Math.cos(a)*d+"px");
    b.style.setProperty("--y",Math.sin(a)*d+"px");
    document.body.appendChild(b);
    setTimeout(()=>b.remove(),800);
  }
}

// click + touch
document.addEventListener("click",e=>burst(e.clientX,e.clientY));
document.addEventListener("touchstart",e=>{
  let t=e.touches[0];
  burst(t.clientX,t.clientY);
});

// drag hearts
document.addEventListener("mousemove",e=>{
  if(Math.random()<0.15) burst(e.clientX,e.clientY);
});

let interval;

// start
function start() {
  document.getElementById("img1").classList.add("clear");
  document.getElementById("img2").classList.add("clear");

  const music = document.getElementById("bgMusic");
  music.play().catch(()=>{});

  interval=setInterval(createHeart,300);

  window.scrollTo({top:window.innerHeight,behavior:"smooth"});

  setTimeout(()=>{
    let t2=document.getElementById("t2");
    t2.classList.add("show");
    typeText(t2,"But somehow… life had other plans.");
  },700);
}

// scroll
window.addEventListener("scroll",()=>{
  let y=window.scrollY;

  if(y>window.innerHeight*1.3){
    let t3=document.getElementById("t3");
    if(!t3.classList.contains("show")){
      t3.classList.add("show");
      typeText(t3,"Out of everyone… it became you.");

      setTimeout(()=>{
        let name=document.getElementById("nameText");
        name.classList.add("show");
        typeText(name,"Ashrita ❤️",100);
      },1200);
    }
  }

  if(y>window.innerHeight*2.3){
    document.getElementById("t4").classList.add("show");
  }
});

// final
function finalMsg(){
  let f=document.getElementById("finalText");
  f.classList.add("show");
  typeText(f,"Me Love You\nMe Always Will Love Youuuuuuuuuuuuuuuuuuuuuuu.",60);

  clearInterval(interval);
  interval=setInterval(createHeart,120);
}
</script>

</body>
</html>
