<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Us</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  background: black;
  color: white;
  overflow-x: hidden;
}

section {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
  padding: 20px;
}

/* Images */
.images {
  display: flex;
  gap: 15px;
}

img {
  width: 140px;
  border-radius: 20px;
  filter: blur(10px);
  transition: 1.5s ease;
}

.clear {
  filter: blur(0);
  transform: scale(1.05);
}

/* Text */
.fade {
  opacity: 0;
  transform: translateY(20px);
  transition: 1s;
}

.show {
  opacity: 1;
  transform: translateY(0);
}

/* Button */
button {
  padding: 10px 20px;
  border: none;
  background: white;
  color: black;
  border-radius: 20px;
  cursor: pointer;
  margin-top: 20px;
}

/* Final text */
#finalText {
  margin-top: 15px;
  font-size: 18px;
}
</style>
</head>

<body>

<audio id="bgMusic" src="music.mp3" loop></audio>

<!-- Section 1 -->
<section>
  <div class="images">
    <img src="aswin.jpg" id="img1">
    <img src="ashrita.jpg" id="img2">
  </div>
  <h1 class="fade" id="t1">We didn’t know it then…</h1>
  <button onclick="start()">See more</button>
</section>

<!-- Section 2 -->
<section>
  <h1 class="fade" id="t2"></h1>
</section>

<!-- Section 3 -->
<section>
  <h1 class="fade" id="t3"></h1>
</section>

<!-- Section 4 -->
<section>
  <h1 class="fade" id="t4">Still is.</h1>
  <button onclick="finalMsg()">Stay</button>
  <p id="finalText" class="fade"></p>
</section>

<script>
// show first text
window.onload = () => {
  document.getElementById("t1").classList.add("show");
};

// typing effect
function typeText(el, text, speed = 40) {
  let i = 0;
  el.innerHTML = "";
  function type() {
    if (i < text.length) {
      el.innerHTML += text.charAt(i);
      i++;
      setTimeout(type, speed);
    }
  }
  type();
}

// start button
function start() {
  // reveal images
  document.getElementById("img1").classList.add("clear");
  document.getElementById("img2").classList.add("clear");

  // play music (user click = allowed)
  const music = document.getElementById("bgMusic");
  music.play().catch(() => {});

  // scroll
  window.scrollTo({
    top: window.innerHeight,
    behavior: "smooth"
  });

  // section 2 text
  setTimeout(() => {
    const t2 = document.getElementById("t2");
    t2.classList.add("show");
    typeText(t2, "But somehow… life had other plans.");
  }, 700);
}

// scroll reveal
window.addEventListener("scroll", () => {
  let y = window.scrollY;

  if (y > window.innerHeight * 1.3) {
    const t3 = document.getElementById("t3");
    if (!t3.classList.contains("show")) {
      t3.classList.add("show");
      typeText(t3, "Out of everyone… it became you.");
    }
  }

  if (y > window.innerHeight * 2.3) {
    document.getElementById("t4").classList.add("show");
  }
});

// final message
function finalMsg() {
  const f = document.getElementById("finalText");
  f.innerHTML = "I love you.<br>I always will.";
  f.classList.add("show");
}
</script>

</body>
</html>
